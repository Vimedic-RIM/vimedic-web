# Registro abierto solo para permitir el primer ingreso con Google de cualquier empleado
# (si no, Supabase rechaza con "Signups not allowed" a quien nunca haya tenido cuenta). No es un
# riesgo: el acceso real lo decide la tabla empleados + permisos (app.puede...), no el solo hecho
# de tener una cuenta de Supabase Auth. El trigger de vínculo por correo (app.tg_vincular_auth_usuario)
# sigue vinculando por email a quien ya es empleado; quien no lo es, entra sin permisos a nada.
# Solo se declara esta propiedad: el resto de la configuración de Auth en el proyecto (URLs,
# proveedores, expiración de sesión, etc.) no se toca.
[auth]
enable_signup = true
# El proyecto seguía con site_url de ejemplo (localhost:3000): Google habría rechazado la vuelta a la app.
site_url = "https://vimedic-qa.pages.dev"
additional_redirect_urls = ["https://vimedic-qa.pages.dev", "https://qa.vimedic.com.ec", "http://localhost:5199"]

# Login con Google (vimedic-crm en Google Cloud). El client_id no es secreto; el client_secret
# se pasa por variable de entorno al desplegar (GOOGLE_CLIENT_SECRET) y nunca se guarda en el repo.
[auth.external.google]
enabled = true
client_id = "984059782625-khhkbk6cbig0tfo89vv21i2i3k52c7i5.apps.googleusercontent.com"
secret = "env(GOOGLE_CLIENT_SECRET)"
