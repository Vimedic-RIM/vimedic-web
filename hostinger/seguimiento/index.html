<!doctype html>
<!--
  Página pública del seguimiento del pedido en el sitio de VIMEDIC (Hostinger).
  Va en:  public_html/seguimiento/index.html   →   https://vimedic.com.ec/seguimiento/?c=<código>
  Muestra dentro de ella la página de seguimiento de la app, así el cliente siempre ve vimedic.com.ec.

  CUANDO LA APP PASE A app.vimedic.com.ec: cambiar SOLO la línea  var APP = '...'  de abajo.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Seguimiento de tu pedido · VIMEDIC</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f6f9fc; font-family: Arial, Helvetica, sans-serif; color: #0b2545; }
    iframe { display: block; border: 0; width: 100%; height: 100%; }
    .msg { max-width: 460px; margin: 18vh auto 0; padding: 0 20px; text-align: center; line-height: 1.5; }
    .msg a { color: #055c9d; font-weight: bold; }
  </style>
</head>
<body>
  <script>
    var APP = 'https://qa.vimedic.com.ec';   // ← dominio de la app (después: 'https://app.vimedic.com.ec')
    var c = new URLSearchParams(location.search).get('c') || '';
    if (!c) {
      document.body.innerHTML = '<div class="msg"><h1>Seguimiento de tu pedido</h1><p>Abre el enlace que te enviamos por WhatsApp o escanea el código QR de tu guía.</p><p><a href="https://vimedic.com.ec">vimedic.com.ec</a></p></div>';
    } else {
      var src = APP + '/seguimiento/?c=' + encodeURIComponent(c);
      var f = document.createElement('iframe');
      f.src = src;
      f.title = 'Seguimiento de tu pedido';
      f.allow = 'clipboard-write; web-share';
      document.body.appendChild(f);
      // Si el navegador no deja mostrarla aquí, se abre directo.
      setTimeout(function () { try { if (!f.contentWindow) location.replace(src); } catch (e) {} }, 8000);
    }
  </script>
  <noscript><div class="msg"><p>Activa JavaScript para ver el seguimiento de tu pedido.</p></div></noscript>
</body>
</html>
